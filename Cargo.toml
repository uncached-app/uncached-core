[package]
name = "uncached-core"
version = "0.1.0"
edition = "2021"

[dependencies]
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
serde_json = "1"
