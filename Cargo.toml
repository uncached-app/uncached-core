[package]
name = "uncached-core"
version = "0.1.0"
edition = "2021"

[features]
bench = []

[dependencies]
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "pruning"
harness = false
required-features = ["bench"]
