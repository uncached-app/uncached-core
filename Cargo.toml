[package]
name = "uncached-core"
version = "0.1.0"
edition = "2021"

[features]
bench = []

[dependencies]
# `fs::canonicalize` on Windows always returns the extended-length form,
# `\\?\C:\work`. Every API accepts it, and it is also what the user reads on
# screen beside every project — a prefix naming nowhere they have ever been.
# `dunce` gives the ordinary form whenever one exists and the verbatim one when
# it is genuinely required: past 260 characters, or on a reserved name. On every
# other platform it is a direct call to `fs::canonicalize`, which is why it is
# not behind a `cfg` — one spelling that means the same thing everywhere.
dunce = "1"
globset = "0.4"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
toml = "1"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

# Same crate and version as above, so the integration tests can take back out of
# the user's Trash what they put there.
[target.'cfg(all(unix, not(target_os = "android")))'.dev-dependencies]
trash = "5.2"

[[bench]]
name = "pruning"
harness = false
required-features = ["bench"]
