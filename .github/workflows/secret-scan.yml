name: Secret scan

# Runs on pull requests, where a secret would enter the repository, and on
# demand. Not on push: a secret that reaches main through a reviewed PR has
# already been scanned, and each run costs minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
