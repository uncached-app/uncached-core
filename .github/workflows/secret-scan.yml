name: Secret scan

# Runs on pull requests, where a secret would enter the repository, and on
# demand. Not on push: a secret that reaches main through a reviewed PR has
# already been scanned, and each run costs minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action needs a paid licence for organisation accounts. The
      # CLI itself is free, so run the pinned image directly over full history.
      - name: Scan history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
