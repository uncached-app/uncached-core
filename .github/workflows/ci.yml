name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Prose does not compile.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not here on purpose. It is billed at ten times the minutes
        # and was seventy-five per cent of everything this account has spent —
        # two hundred real minutes becoming two thousand — to check the one
        # platform that is compiled and tested on the machine this is written
        # on, every time anybody works on it.
        #
        # Linux and Windows stay because neither is covered anywhere else, and
        # between them they cost a fifth of what macOS alone did. Windows
        # especially: this crate has tests that only exist there, and they are
        # what caught the last real bug in it.
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run Linux Unix-cleanup smoke test
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --test node_modules public_clean_to_trash_fails_closed_without_mutating_target

      - name: Compile benches without running them
        run: cargo bench --bench pruning --features bench --no-run

  contract:
    name: contract v1 surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: contract

      - name: Run contract tests
        run: cargo test --test contract_v1

      - name: Fail when the contract document is missing
        run: test -f CONTRACT_V1.md
